<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChessBot AI</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        body {
            background-color: #161512;
            color: #bababa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            width: 100%;
            max-width: 460px;
            padding: 10px;
        }
        #board {
            width: 100%;
            margin: 8px 0;
        }
        .status {
            font-size: 1.1rem;
            margin-bottom: 15px;
            font-weight: 600;
        }
        button {
            background-color: #363431;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #45433f;
        }
        .clock {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #262421;
            border-radius: 4px;
            padding: 8px 14px;
            transition: background-color 0.2s, color 0.2s;
        }
        .clock-label {
            font-size: 0.85rem;
            color: #8b8987;
        }
        .clock-time {
            font-family: "SF Mono", "Consolas", "Roboto Mono", monospace;
            font-size: 1.8rem;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            color: #bababa;
        }
        .clock.active {
            background-color: #3d3b37;
        }
        .clock.active .clock-time {
            color: #fff;
        }
        .clock.low .clock-time {
            color: #d64f4f;
        }
        .clock.flagged {
            background-color: #4a2222;
        }
        .time-control {
            font-size: 0.8rem;
            color: #8b8987;
            margin-bottom: 10px;
        }
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 12px;
            font-size: 0.85rem;
            color: #8b8987;
        }
        select {
            background-color: #363431;
            color: #fff;
            border: none;
            padding: 6px 10px;
            font-size: 0.9rem;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>ChessBot &mdash; Fast &amp; Fluid</h2>
    <div class="time-control">Cadence 3+2</div>

    <div class="controls">
        <label for="bot">Adversaire</label>
        <select id="bot"></select>
    </div>

    <div class="status" id="status">&Agrave; vous de jouer (Blancs)</div>

    <div class="clock" id="clock-b">
        <span class="clock-label">Bot (Noirs)</span>
        <span class="clock-time" id="time-b">3:00</span>
    </div>

    <div id="board"></div>

    <div class="clock" id="clock-w">
        <span class="clock-label">Vous (Blancs)</span>
        <span class="clock-time" id="time-w">3:00</span>
    </div>

    <p><button onclick="resetGame()">Nouvelle partie</button></p>
</div>

<script>
    var INITIAL_MS = 3 * 60 * 1000;
    var INCREMENT_MS = 2 * 1000;

    var board = null;
    var game = new Chess();
    var $status = $('#status');

    var clock = { w: INITIAL_MS, b: INITIAL_MS };
    var running = null;      // 'w', 'b', ou null si la pendule est arretee
    var lastTick = null;
    var timerId = null;
    var flagged = null;      // couleur ayant depasse le temps

    function isOver() {
        return game.game_over() || flagged !== null;
    }

    function formatTime(ms) {
        if (ms < 0) ms = 0;
        var m = Math.floor(ms / 60000);
        var s = (ms - m * 60000) / 1000;
        // Sous 10 secondes on affiche le dixieme, comme une pendule de blitz
        if (ms < 10000) {
            return m + ':' + (s < 10 ? '0' : '') + s.toFixed(1);
        }
        return m + ':' + String(Math.floor(s)).padStart(2, '0');
    }

    function renderClocks() {
        ['w', 'b'].forEach(function (color) {
            $('#time-' + color).text(formatTime(clock[color]));
            $('#clock-' + color)
                .toggleClass('active', running === color)
                .toggleClass('low', clock[color] < 30000 && clock[color] > 0)
                .toggleClass('flagged', flagged === color);
        });
    }

    // Impute a la couleur active le temps ecoule depuis le dernier point de mesure.
    function settle() {
        var now = Date.now();
        if (running !== null && lastTick !== null) {
            clock[running] -= now - lastTick;
        }
        lastTick = now;
    }

    function startClock(color) {
        settle();
        running = color;
        if (timerId === null) {
            timerId = setInterval(tick, 100);
        }
        renderClocks();
    }

    function stopClock() {
        settle();
        running = null;
        if (timerId !== null) {
            clearInterval(timerId);
            timerId = null;
        }
        renderClocks();
    }

    function tick() {
        settle();
        if (running !== null && clock[running] <= 0) {
            clock[running] = 0;
            onFlag(running);
            return;
        }
        renderClocks();
    }

    function onFlag(color) {
        flagged = color;
        stopClock();
        $status.text(color === 'w'
            ? "Temps écoulé — le bot gagne."
            : "Temps écoulé — vous gagnez !");
    }

    function onDragStart (source, piece, position, orientation) {
        if (isOver() || piece.search(/^b/) !== -1) {
            return false;
        }
    }

    async function onDrop (source, target) {
        if (isOver()) return 'snapback';

        var fenBefore = game.fen();
        // Instantane pour revenir en arriere si l'API refuse le coup
        var snapshot = { w: clock.w, b: clock.b, running: running };

        var move = game.move({
            from: source,
            to: target,
            promotion: 'q'
        });

        if (move === null) return 'snapback';

        var uci = move.from + move.to + (move.promotion || '');

        // Coup blanc termine : increment, puis la pendule passe aux Noirs.
        // Au premier coup, c'est aussi ce qui demarre la pendule.
        settle();
        clock.w += INCREMENT_MS;
        startClock('b');

        $status.text("Le bot réfléchit...");

        function rollback() {
            game.undo();
            board.position(game.fen());
            clock.w = snapshot.w;
            clock.b = snapshot.b;
            if (snapshot.running === null) {
                stopClock();
                lastTick = null;
            } else {
                startClock(snapshot.running);
            }
        }

        try {
            const response = await fetch('/api/move', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    fen: fenBefore,
                    move: uci,
                    bot: $('#bot').val(),
                    // Le bot borne sa reflexion sur son propre temps restant
                    ms_left: Math.max(0, Math.round(clock.b))
                })
            });

            const data = await response.json();

            if (data.error) {
                rollback();
                $status.text("Coup invalide.");
                return;
            }

            game.load(data.fen);
            board.position(game.fen());

            // Le bot a repondu : increment pour les Noirs, la main revient aux Blancs.
            settle();
            if (data.bot_move) {
                clock.b += INCREMENT_MS;
            }

            if (data.game_over) {
                stopClock();
            } else {
                startClock('w');
            }

            $status.text(data.status);

        } catch (err) {
            console.error("Erreur API:", err);
            rollback();
            $status.text("Erreur de connexion au serveur.");
        }
    }

    function resetGame() {
        game.reset();
        board.position('start');
        stopClock();
        clock.w = INITIAL_MS;
        clock.b = INITIAL_MS;
        flagged = null;
        lastTick = null;
        renderClocks();
        $status.text("À vous de jouer (Blancs)");
    }

    // La liste des adversaires vient du serveur : ajouter un bot cote Python
    // suffit a le faire apparaitre ici.
    async function loadBots() {
        var $select = $('#bot');
        try {
            const response = await fetch('/api/bots');
            const data = await response.json();
            $select.empty();
            data.bots.forEach(function (bot) {
                $select.append($('<option>').val(bot.name).text(bot.label));
            });
            $select.val(data.default);
        } catch (err) {
            console.error("Impossible de charger la liste des bots:", err);
            $select.empty().append($('<option>').val('normal').text('Minimax - Normal'));
        }
    }

    board = Chessboard('board', {
        draggable: true,
        position: 'start',
        onDragStart: onDragStart,
        onDrop: onDrop,
        pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
    });

    renderClocks();
    loadBots();
</script>

</body>
</html>
