<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChessBot AI</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        body {
            background-color: #161512;
            color: #bababa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            width: 100%;
            max-width: 460px;
            padding: 10px;
        }
        #board {
            width: 100%;
            margin: 15px 0;
        }
        .status {
            font-size: 1.1rem;
            margin-bottom: 15px;
            font-weight: 600;
        }
        button {
            background-color: #363431;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #45433f;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>ChessBot — Fast & Fluid</h2>
    <div class="status" id="status">À vous de jouer (Blancs)</div>
    <div id="board"></div>
    <button onclick="resetGame()">Nouvelle partie</button>
</div>

<script>
    var board = null;
    var game = new Chess();
    var $status = $('#status');

    function onDragStart (source, piece, position, orientation) {
        if (game.game_over() || piece.search(/^b/) !== -1) {
            return false;
        }
    }

    async function onDrop (source, target) {
        var fenBefore = game.fen();

        var move = game.move({
            from: source,
            to: target,
            promotion: 'q'
        });

        if (move === null) return 'snapback';

        var uci = move.from + move.to + (move.promotion || '');

        $status.text("Le bot réfléchit...");

        try {
            const response = await fetch('/api/move', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fen: fenBefore, move: uci })
            });

            const data = await response.json();

            if (data.error) {
                game.undo();
                board.position(game.fen());
                $status.text("Coup invalide.");
                return;
            }

            game.load(data.fen);
            board.position(game.fen());
            $status.text(data.status);

        } catch (err) {
            console.error("Erreur API:", err);
            game.undo();
            board.position(game.fen());
            $status.text("Erreur de connexion au serveur.");
        }
    }

    function resetGame() {
        game.reset();
        board.position('start');
        $status.text("À vous de jouer (Blancs)");
    }

    board = Chessboard('board', {
        draggable: true,
        position: 'start',
        onDragStart: onDragStart,
        onDrop: onDrop,
        pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
    });
</script>

</body>
</html>
